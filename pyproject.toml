[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propintel"
version = "1.0.0"
description = "Property Valuation & Real Estate Market Intelligence Platform"
authors = [{name = "Adam Javed"}]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "scikit-learn>=1.4",
  "scipy>=1.11", "lightgbm>=4.3", "mlflow>=2.14", "joblib>=1.3", "pydantic>=2.6",
  "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]
