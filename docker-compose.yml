# docker compose up --build
#   1. mlflow     -> experiment tracking + model registry  (http://localhost:5000)
#   2. pipeline   -> one-shot job: generate data -> ETL -> train -> register model
#   3. api        -> FastAPI service                        (http://localhost:8000/docs)
#   4. prometheus -> scrapes /metrics                       (http://localhost:9090)
x-app: &app
  build: .
  environment: &env
    PROPINTEL_HOME: /app
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - platform-data:/app/data
    - platform-models:/app/models
    - platform-reports:/app/reports

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts
    volumes: [mlflow-data:/mlflow]
    ports: ["5000:5000"]

  pipeline:
    <<: *app
    depends_on: [mlflow]
    command: >
      sh -c "python -m propintel.data.generate &&
             python -m propintel.pipeline.medallion &&
             python -m propintel.model.train"
    restart: "no"

  api:
    <<: *app
    depends_on:
      pipeline: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  platform-data:
  platform-models:
  platform-reports:
  mlflow-data:
